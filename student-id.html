<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student ID Card Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .form-section {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .form-section h1 {
            color: #1a1a2e;
            margin-bottom: 10px;
            font-size: 28px;
            font-weight: 700;
            font-family: 'Playfair Display', serif;
        }

        .form-section > p {
            color: #888;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .photo-upload {
            margin-bottom: 30px;
        }

        .photo-upload input[type="file"] {
            padding: 14px 16px;
        }

        .photo-preview {
            width: 160px;
            height: 160px;
            border: 3px dashed #667eea;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 15px;
            overflow: hidden;
            background: linear-gradient(135deg, #f5f7fa 0%, #f0f3f8 100%);
            transition: all 0.3s ease;
        }

        .photo-preview:hover {
            border-color: #764ba2;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.2);
        }

        .photo-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
        }

        .photo-preview.empty {
            color: #999;
            font-size: 12px;
            text-align: center;
            flex-direction: column;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 40px;
        }

        button {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn-generate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .btn-generate:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
        }

        .btn-reset {
            background: #f0f0f0;
            color: #333;
        }

        .btn-reset:hover {
            background: #e0e0e0;
            transform: translateY(-3px);
        }

        .btn-print {
            background: linear-gradient(135deg, #00d4ff 0%, #0099ff 100%);
            color: white;
            box-shadow: 0 10px 25px rgba(0, 153, 255, 0.3);
        }

        .btn-print:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0, 153, 255, 0.4);
        }

        .card-section {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .id-card {
            width: 100%;
            height: 550px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            border-radius: 25px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35), 0 0 60px rgba(102, 126, 234, 0.2);
            padding: 35px;
            color: white;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            animation: cardSlide 0.6s ease-out;
        }

        @keyframes cardSlide {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .id-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255,255,255,0.15) 1px, transparent 1px),
                radial-gradient(circle at 80% 80%, rgba(255,255,255,0.1) 2px, transparent 2px);
            background-size: 50px 50px, 80px 80px;
            pointer-events: none;
            animation: shimmer 8s linear infinite;
        }

        @keyframes shimmer {
            0% {
                transform: translate(0, 0);
            }
            100% {
                transform: translate(50px, 50px);
            }
        }

        .id-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
        }

        .id-card-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: space-between;
        }

        .id-card-header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.4);
            padding-bottom: 15px;
        }

        .id-card-header h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 5px;
            font-family: 'Playfair Display', serif;
            letter-spacing: 1px;
        }

        .id-card-header p {
            font-size: 12px;
            opacity: 0.85;
            font-weight: 300;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .id-card-body {
            display: flex;
            flex: 1;
            gap: 28px;
            margin-bottom: 20px;
            align-items: flex-start;
        }

        .photo-section {
            flex-shrink: 0;
        }

        .student-photo {
            width: 140px;
            height: 165px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3), inset 0 0 0 1px rgba(255,255,255,0.3);
            border: 3px solid rgba(255, 255, 255, 0.5);
        }

        .student-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .info-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-size: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: 600;
            opacity: 0.8;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-weight: 500;
            text-align: right;
            font-size: 13px;
        }

        .id-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid rgba(255, 255, 255, 0.4);
            padding-top: 15px;
        }

        .student-id {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
            font-family: 'Courier New', monospace;
        }

        .validity {
            text-align: right;
        }

        .validity-label {
            font-size: 10px;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .validity-text {
            font-weight: 700;
            font-size: 13px;
            margin-top: 3px;
        }

        .empty-card {
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 18px;
            text-align: center;
            flex-direction: column;
            gap: 10px;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }

            .container {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .form-section {
                display: none;
            }

            .card-section {
                gap: 0;
            }

            .button-group {
                display: none;
            }

            .id-card {
                box-shadow: none;
                border-radius: 0;
                margin-bottom: 50px;
                height: auto;
                animation: none;
            }
        }

        .success-message {
            display: none;
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            color: #155724;
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #28a745;
            font-weight: 500;
            animation: slideDown 0.4s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-section">
            <h1>🎓 ID Card Studio</h1>
            <p>Create a professional student ID card</p>
            
            <div class="success-message" id="successMessage">
                ✓ ID Card generated successfully!
            </div>

            <form id="studentForm" onsubmit="handleSubmit(event)">
                <div class="photo-upload">
                    <label>📸 Student Photo</label>
                    <input type="file" id="photoInput" accept="image/*">
                    <div class="photo-preview empty" id="photoPreview">
                        <span>No photo selected</span>
                    </div>
                </div>

                <div class="form-group full">
                    <label for="studentName">Full Name *</label>
                    <input type="text" id="studentName" placeholder="Enter full name" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="rollNumber">Roll Number *</label>
                        <input type="text" id="rollNumber" placeholder="e.g., CS2024001" required>
                    </div>
                    <div class="form-group">
                        <label for="studentId">Student ID *</label>
                        <input type="text" id="studentId" placeholder="e.g., 12345678" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="department">Department *</label>
                        <input type="text" id="department" placeholder="e.g., Computer Science" required>
                    </div>
                    <div class="form-group">
                        <label for="semester">Semester *</label>
                        <select id="semester" required>
                            <option value="">Select Semester</option>
                            <option value="1st">1st Semester</option>
                            <option value="2nd">2nd Semester</option>
                            <option value="3rd">3rd Semester</option>
                            <option value="4th">4th Semester</option>
                            <option value="5th">5th Semester</option>
                            <option value="6th">6th Semester</option>
                            <option value="7th">7th Semester</option>
                            <option value="8th">8th Semester</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="student@university.edu">
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone" placeholder="9876543210">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="issueDate">Issue Date *</label>
                        <input type="date" id="issueDate" required>
                    </div>
                    <div class="form-group">
                        <label for="expiryDate">Expiry Date *</label>
                        <input type="date" id="expiryDate" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="dob">Date of Birth</label>
                        <input type="date" id="dob">
                    </div>
                    <div class="form-group">
                        <label for="bloodGroup">Blood Group</label>
                        <select id="bloodGroup">
                            <option value="">Select Blood Group</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                    </div>
                </div>

                <div class="form-group full">
                    <label for="address">Address</label>
                    <textarea id="address" placeholder="Enter student address"></textarea>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-generate">✨ Generate ID Card</button>
                    <button type="reset" class="btn-reset">↻ Clear</button>
                </div>
            </form>
        </div>

        <div class="card-section">
            <div id="cardContainer">
                <div class="id-card">
                    <div class="empty-card">
                        <span>👆</span>
                        <span>Fill in the form to create your ID card</span>
                    </div>
                </div>
            </div>
            <button class="btn-print" id="printBtn" style="display: none;" onclick="printCard()">🖨️ Print ID Card</button>
        </div>
    </div>

    <script>
        // Photo preview functionality
        document.getElementById('photoInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const photoPreview = document.getElementById('photoPreview');
                    photoPreview.innerHTML = '<img src="' + event.target.result + '" alt="Student Photo">';
                    photoPreview.classList.remove('empty');
                };
                reader.readAsDataURL(file);
            }
        });

        // Handle form submission
        function handleSubmit(event) {
            event.preventDefault();

            // Get all form values
            const studentName = document.getElementById('studentName').value;
            const rollNumber = document.getElementById('rollNumber').value;
            const studentId = document.getElementById('studentId').value;
            const department = document.getElementById('department').value;
            const semester = document.getElementById('semester').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const dob = document.getElementById('dob').value;
            const issueDate = document.getElementById('issueDate').value;
            const expiryDate = document.getElementById('expiryDate').value;
            const bloodGroup = document.getElementById('bloodGroup').value;
            const address = document.getElementById('address').value;
            
            const photoImg = document.querySelector('#photoPreview img');
            const photoSrc = photoImg ? photoImg.src : null;

            // Generate ID card
            generateIDCard({
                name: studentName,
                rollNumber: rollNumber,
                studentId: studentId,
                department: department,
                semester: semester,
                email: email,
                phone: phone,
                dob: dob,
                issueDate: issueDate,
                expiryDate: expiryDate,
                bloodGroup: bloodGroup,
                address: address,
                photo: photoSrc
            });

            // Show success message
            const successMessage = document.getElementById('successMessage');
            successMessage.classList.add('show');
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 3000);
        }

        function generateIDCard(data) {
            const formattedExpiryDate = formatDate(data.expiryDate);

            const cardHTML = `
                <div class="id-card">
                    <div class="id-card-content">
                        <div class="id-card-header">
                            <h2>STUDENT ID CARD</h2>
                            <p>Academic Identification</p>
                        </div>

                        <div class="id-card-body">
                            <div class="photo-section">
                                <div class="student-photo">
                                    ${data.photo ? '<img src="' + data.photo + '" alt="Student Photo">' : '<div style="background: rgba(255,255,255,0.2); width: 100%; height: 100%;"></div>'}
                                </div>
                            </div>

                            <div class="info-section">
                                <div class="info-row">
                                    <span class="info-label">Name</span>
                                    <span class="info-value">${data.name}</span>
                                </div>
                                <div class="info-row">
                                    <span class="info-label">Roll No</span>
                                    <span class="info-value">${data.rollNumber}</span>
                                </div>
                                <div class="info-row">
                                    <span class="info-label">Department</span>
                                    <span class="info-value">${data.department}</span>
                                </div>
                                <div class="info-row">
                                    <span class="info-label">Semester</span>
                                    <span class="info-value">${data.semester}</span>
                                </div>
                                ${data.phone ? '<div class="info-row"><span class="info-label">Phone</span><span class="info-value">' + data.phone + '</span></div>' : ''}
                                ${data.bloodGroup ? '<div class="info-row"><span class="info-label">Blood Group</span><span class="info-value">' + data.bloodGroup + '</span></div>' : ''}
                            </div>
                        </div>

                        <div class="id-card-footer">
                            <div class="student-id">ID: ${data.studentId}</div>
                            <div class="validity">
                                <div class="validity-label">Valid Till</div>
                                <div class="validity-text">${formattedExpiryDate}</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('cardContainer').innerHTML = cardHTML;
            document.getElementById('printBtn').style.display = 'block';
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('en-US', options);
        }

        function printCard() {
            window.print();
        }

        // Set today's date as default issue date
        window.addEventListener('load', function() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            document.getElementById('issueDate').value = year + '-' + month + '-' + day;
        });
    </script>
</body>
</html>
